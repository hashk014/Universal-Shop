# Chest menu layouts. Slots are numbered from 0 (top left).
# Every control key is its ORIGINAL default slot; its value is the new slot.
# Reload with /shop admin reload. Duplicates/out-of-range slots reject the reload.
# Content order controls display order and page size. Keep controls separate.
# title: optional override, & colors and {page}; blank keeps translated titles.
# background: optional Material aliases; omit to inherit config.yml menu-background.
# decorations: [{slots: [0], material: GLASS, name: " ", lore: []}]
# Full examples: docs/MENUS.md. Native Bedrock forms do not use chest geometry.

