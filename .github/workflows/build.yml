name: Build and unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - run: UNIVERSALSHOP_TEST_JAVA="$JAVA_HOME/bin/java" python -m unittest discover -s tools -p test_migrate_economy.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalShop
          path: |
            target/UniversalShop-*.jar
            target/surefire-reports/
